<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-label="Data pipeline as an Indian Railways journey: Collect, Research, Build">
  <defs>
    <linearGradient id="parch" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff8e7"/>
      <stop offset="1" stop-color="#ffedc2"/>
    </linearGradient>
    <linearGradient id="engine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff7a00"/>
      <stop offset="1" stop-color="#c0392b"/>
    </linearGradient>
    <g id="smoke">
      <circle r="6" fill="#b9b9b9" opacity="0.8"/>
    </g>
  </defs>

  <rect x="4" y="4" width="1192" height="332" rx="18" fill="url(#parch)" stroke="#c0392b" stroke-width="3"/>
  <rect x="14" y="14" width="1172" height="312" rx="12" fill="none" stroke="#138808" stroke-width="1.4" stroke-dasharray="2 8"/>

  <text x="600" y="46" text-anchor="middle" font-family="'Trebuchet MS',sans-serif" font-size="24" font-weight="800" fill="#7a1f12">डेटा एक्सप्रेस · THE DATA EXPRESS</text>
  <text x="600" y="70" text-anchor="middle" font-family="'Trebuchet MS',sans-serif" font-size="13" fill="#9a5b00" letter-spacing="2">raw sources → staged tables → weekly training data</text>

  <!-- rail line with sleepers -->
  <g>
    <line x1="70" y1="196" x2="1130" y2="196" stroke="#5b3a1a" stroke-width="4"/>
    <line x1="70" y1="208" x2="1130" y2="208" stroke="#5b3a1a" stroke-width="4"/>
    <g stroke="#7a5230" stroke-width="5">
      <line x1="90" y1="192" x2="90" y2="212"/><line x1="130" y1="192" x2="130" y2="212"/>
      <line x1="170" y1="192" x2="170" y2="212"/><line x1="210" y1="192" x2="210" y2="212"/>
      <line x1="250" y1="192" x2="250" y2="212"/><line x1="290" y1="192" x2="290" y2="212"/>
      <line x1="330" y1="192" x2="330" y2="212"/><line x1="370" y1="192" x2="370" y2="212"/>
      <line x1="410" y1="192" x2="410" y2="212"/><line x1="450" y1="192" x2="450" y2="212"/>
      <line x1="490" y1="192" x2="490" y2="212"/><line x1="530" y1="192" x2="530" y2="212"/>
      <line x1="570" y1="192" x2="570" y2="212"/><line x1="610" y1="192" x2="610" y2="212"/>
      <line x1="650" y1="192" x2="650" y2="212"/><line x1="690" y1="192" x2="690" y2="212"/>
      <line x1="730" y1="192" x2="730" y2="212"/><line x1="770" y1="192" x2="770" y2="212"/>
      <line x1="810" y1="192" x2="810" y2="212"/><line x1="850" y1="192" x2="850" y2="212"/>
      <line x1="890" y1="192" x2="890" y2="212"/><line x1="930" y1="192" x2="930" y2="212"/>
      <line x1="970" y1="192" x2="970" y2="212"/><line x1="1010" y1="192" x2="1010" y2="212"/>
      <line x1="1050" y1="192" x2="1050" y2="212"/><line x1="1090" y1="192" x2="1090" y2="212"/>
    </g>
  </g>

  <!-- three stations (yellow railway boards) -->
  <!-- Station 1: COLLECT -->
  <g transform="translate(230 0)">
    <line x1="0" y1="150" x2="0" y2="190" stroke="#333" stroke-width="3"/>
    <rect x="-96" y="96" width="192" height="54" rx="6" fill="#ffd400" stroke="#111" stroke-width="2"/>
    <text x="0" y="120" text-anchor="middle" font-family="'Trebuchet MS',sans-serif" font-size="18" font-weight="800" fill="#111">COLLECT</text>
    <text x="0" y="140" text-anchor="middle" font-family="'Nirmala UI','Noto Sans Devanagari',sans-serif" font-size="13" fill="#333">इकट्ठा · स्टेज-1</text>
    <circle cx="0" cy="202" r="7" fill="#138808" stroke="#111" stroke-width="2"/>
    <text x="0" y="248" text-anchor="middle" font-family="'Trebuchet MS',sans-serif" font-size="12" fill="#5b3a1a">mandi · weather</text>
    <text x="0" y="264" text-anchor="middle" font-family="'Trebuchet MS',sans-serif" font-size="12" fill="#5b3a1a">markets · USDA</text>
    <text x="0" y="286" text-anchor="middle" font-family="'Trebuchet MS',sans-serif" font-size="11" font-style="italic" fill="#9a5b00">→ data/staged/*.parquet</text>
  </g>
  <!-- Station 2: RESEARCH -->
  <g transform="translate(600 0)">
    <line x1="0" y1="150" x2="0" y2="190" stroke="#333" stroke-width="3"/>
    <rect x="-100" y="96" width="200" height="54" rx="6" fill="#ffd400" stroke="#111" stroke-width="2"/>
    <text x="0" y="120" text-anchor="middle" font-family="'Trebuchet MS',sans-serif" font-size="18" font-weight="800" fill="#111">RESEARCH</text>
    <text x="0" y="140" text-anchor="middle" font-family="'Nirmala UI','Noto Sans Devanagari',sans-serif" font-size="13" fill="#333">खोज · स्टेज-2 · optional</text>
    <circle cx="0" cy="202" r="7" fill="#ff7a00" stroke="#111" stroke-width="2"/>
    <text x="0" y="248" text-anchor="middle" font-family="'Trebuchet MS',sans-serif" font-size="12" fill="#5b3a1a">Tavily + Gemini</text>
    <text x="0" y="264" text-anchor="middle" font-family="'Trebuchet MS',sans-serif" font-size="12" fill="#5b3a1a">LLM agent, per window</text>
    <text x="0" y="286" text-anchor="middle" font-family="'Trebuchet MS',sans-serif" font-size="11" font-style="italic" fill="#9a5b00">→ agent_*.parquet</text>
  </g>
  <!-- Station 3: BUILD -->
  <g transform="translate(970 0)">
    <line x1="0" y1="150" x2="0" y2="190" stroke="#333" stroke-width="3"/>
    <rect x="-96" y="96" width="192" height="54" rx="6" fill="#ffd400" stroke="#111" stroke-width="2"/>
    <text x="0" y="120" text-anchor="middle" font-family="'Trebuchet MS',sans-serif" font-size="18" font-weight="800" fill="#111">BUILD</text>
    <text x="0" y="140" text-anchor="middle" font-family="'Nirmala UI','Noto Sans Devanagari',sans-serif" font-size="13" fill="#333">बनाओ · स्टेज-3</text>
    <circle cx="0" cy="202" r="7" fill="#c0392b" stroke="#111" stroke-width="2"/>
    <text x="0" y="248" text-anchor="middle" font-family="'Trebuchet MS',sans-serif" font-size="12" fill="#5b3a1a">weekly grid + cutoff</text>
    <text x="0" y="264" text-anchor="middle" font-family="'Trebuchet MS',sans-serif" font-size="12" fill="#5b3a1a">point-in-time features</text>
    <text x="0" y="286" text-anchor="middle" font-family="'Trebuchet MS',sans-serif" font-size="11" font-style="italic" fill="#9a5b00">→ training_weekly.*</text>
  </g>

  <!-- the train, chugging left to right -->
  <g>
    <animateMotion dur="9s" repeatCount="indefinite" rotate="0" path="M60 170 L1140 170"/>
    <!-- smoke puffs -->
    <g transform="translate(-6 -30)">
      <use href="#smoke"><animate attributeName="opacity" values="0;0.9;0" dur="1.4s" repeatCount="indefinite"/>
        <animateTransform attributeName="transform" type="translate" values="0 0;-10 -24;-20 -44" dur="1.4s" repeatCount="indefinite"/></use>
    </g>
    <!-- wheels -->
    <circle cx="-22" cy="22" r="8" fill="#222" stroke="#ffd400" stroke-width="2"/>
    <circle cx="4" cy="22" r="8" fill="#222" stroke="#ffd400" stroke-width="2"/>
    <circle cx="30" cy="22" r="8" fill="#222" stroke="#ffd400" stroke-width="2"/>
    <!-- body -->
    <rect x="-34" y="-16" width="74" height="34" rx="7" fill="url(#engine)" stroke="#5a1230" stroke-width="2"/>
    <rect x="-30" y="-30" width="20" height="18" rx="3" fill="#138808" stroke="#5a1230" stroke-width="1.5"/>
    <rect x="-8" y="-10" width="14" height="14" rx="2" fill="#fff3b0" stroke="#5a1230"/>
    <rect x="12" y="-10" width="14" height="14" rx="2" fill="#fff3b0" stroke="#5a1230"/>
    <!-- chimney -->
    <rect x="-28" y="-26" width="9" height="12" rx="2" fill="#2d0b3a"/>
    <!-- tricolour flag -->
    <line x1="40" y1="-16" x2="40" y2="-34" stroke="#333" stroke-width="2"/>
    <rect x="40" y="-34" width="18" height="5" fill="#FF9933"/>
    <rect x="40" y="-29" width="18" height="5" fill="#ffffff"/>
    <rect x="40" y="-24" width="18" height="5" fill="#138808"/>
  </g>
</svg>
