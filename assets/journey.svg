<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-label="Data pipeline from field to granary: Collect, Research, Build">
  <defs>
    <linearGradient id="jsky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bfe3f2"/><stop offset="1" stop-color="#eaf6e0"/>
    </linearGradient>
    <linearGradient id="jground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8fbb48"/><stop offset="1" stop-color="#6f9c33"/>
    </linearGradient>
    <linearGradient id="tractor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4e9a2f"/><stop offset="1" stop-color="#2f6d1a"/>
    </linearGradient>
    <g id="jsmoke"><circle r="5" fill="#b9b9b9" opacity="0.8"/></g>
  </defs>

  <rect x="4" y="4" width="1192" height="332" rx="18" fill="url(#jsky)" stroke="#6f9c33" stroke-width="3"/>

  <text x="600" y="44" text-anchor="middle" font-family="'Georgia',serif" font-size="24" font-weight="800" fill="#2f5d1a">FROM FIELD TO GRANARY</text>
  <text x="600" y="68" text-anchor="middle" font-family="'Trebuchet MS',sans-serif" font-size="13" fill="#5c7a2e" letter-spacing="2">raw sources → staged tables → weekly training data</text>

  <!-- ground + dirt road -->
  <rect x="4" y="214" width="1192" height="122" rx="0" fill="url(#jground)"/>
  <rect x="4" y="232" width="1192" height="40" fill="#a9743f"/>
  <rect x="4" y="232" width="1192" height="40" fill="none"/>
  <g stroke="#f3e6c6" stroke-width="4" stroke-dasharray="26 22" opacity="0.8"><line x1="20" y1="252" x2="1180" y2="252"/></g>

  <!-- three wooden signposts -->
  <!-- 1 COLLECT -->
  <g transform="translate(230 0)">
    <rect x="-5" y="150" width="10" height="70" rx="2" fill="#8a5a2b"/>
    <g transform="rotate(-3)">
      <rect x="-96" y="96" width="192" height="52" rx="6" fill="#b07a3e" stroke="#6e4620" stroke-width="3"/>
      <rect x="-88" y="103" width="176" height="38" rx="4" fill="none" stroke="#e7cf9d" stroke-width="1.5"/>
      <text x="0" y="121" text-anchor="middle" font-family="'Georgia',serif" font-size="18" font-weight="800" fill="#2f1d0c">COLLECT</text>
      <text x="0" y="139" text-anchor="middle" font-family="'Trebuchet MS',sans-serif" font-size="12" fill="#4a2f16">gather the fields · stage 1</text>
    </g>
    <text x="0" y="296" text-anchor="middle" font-family="'Trebuchet MS',sans-serif" font-size="12" fill="#2f1d0c">mandi · weather</text>
    <text x="0" y="312" text-anchor="middle" font-family="'Trebuchet MS',sans-serif" font-size="12" fill="#2f1d0c">markets · USDA</text>
    <text x="0" y="330" text-anchor="middle" font-family="'Trebuchet MS',sans-serif" font-size="11" font-style="italic" fill="#f3e6c6">→ staged/*.parquet</text>
  </g>
  <!-- 2 RESEARCH -->
  <g transform="translate(600 0)">
    <rect x="-5" y="150" width="10" height="70" rx="2" fill="#8a5a2b"/>
    <g transform="rotate(2)">
      <rect x="-100" y="96" width="200" height="52" rx="6" fill="#b07a3e" stroke="#6e4620" stroke-width="3"/>
      <rect x="-92" y="103" width="184" height="38" rx="4" fill="none" stroke="#e7cf9d" stroke-width="1.5"/>
      <text x="0" y="121" text-anchor="middle" font-family="'Georgia',serif" font-size="18" font-weight="800" fill="#2f1d0c">RESEARCH</text>
      <text x="0" y="139" text-anchor="middle" font-family="'Trebuchet MS',sans-serif" font-size="12" fill="#4a2f16">scout the market · optional</text>
    </g>
    <text x="0" y="296" text-anchor="middle" font-family="'Trebuchet MS',sans-serif" font-size="12" fill="#2f1d0c">Tavily + Gemini</text>
    <text x="0" y="312" text-anchor="middle" font-family="'Trebuchet MS',sans-serif" font-size="12" fill="#2f1d0c">LLM agent, per window</text>
    <text x="0" y="330" text-anchor="middle" font-family="'Trebuchet MS',sans-serif" font-size="11" font-style="italic" fill="#f3e6c6">→ agent_*.parquet</text>
  </g>
  <!-- 3 BUILD -->
  <g transform="translate(970 0)">
    <rect x="-5" y="150" width="10" height="70" rx="2" fill="#8a5a2b"/>
    <g transform="rotate(-2)">
      <rect x="-96" y="96" width="192" height="52" rx="6" fill="#b07a3e" stroke="#6e4620" stroke-width="3"/>
      <rect x="-88" y="103" width="176" height="38" rx="4" fill="none" stroke="#e7cf9d" stroke-width="1.5"/>
      <text x="0" y="121" text-anchor="middle" font-family="'Georgia',serif" font-size="18" font-weight="800" fill="#2f1d0c">BUILD</text>
      <text x="0" y="139" text-anchor="middle" font-family="'Trebuchet MS',sans-serif" font-size="12" fill="#4a2f16">thresh to weekly rows · stage 3</text>
    </g>
    <text x="0" y="296" text-anchor="middle" font-family="'Trebuchet MS',sans-serif" font-size="12" fill="#2f1d0c">weekly grid + cutoff</text>
    <text x="0" y="312" text-anchor="middle" font-family="'Trebuchet MS',sans-serif" font-size="12" fill="#2f1d0c">point-in-time features</text>
    <text x="0" y="330" text-anchor="middle" font-family="'Trebuchet MS',sans-serif" font-size="11" font-style="italic" fill="#f3e6c6">→ training_weekly.*</text>
  </g>

  <!-- a little granary/silo at the end of the road -->
  <g transform="translate(1120 206)">
    <rect x="0" y="0" width="30" height="46" rx="4" fill="#d6dde0" stroke="#8a97a0" stroke-width="2"/>
    <ellipse cx="15" cy="0" rx="15" ry="6" fill="#b9c3c8"/>
    <path d="M0 0 A15 14 0 0 1 30 0" fill="#9aa5ab"/>
  </g>

  <!-- the tractor, driving the road (front = right, big drive wheel at the rear = left) -->
  <g>
    <animateMotion dur="10s" repeatCount="indefinite" rotate="0" path="M60 234 L1080 234"/>
    <!-- grain trailer towed behind (left) -->
    <rect x="-72" y="6" width="30" height="15" rx="2" fill="#8a5a2b" stroke="#5c3a18" stroke-width="1.5"/>
    <path d="M-70 6 q15 -9 26 0 q-13 3 -26 0Z" fill="#E3B23C"/>
    <circle cx="-64" cy="22" r="6" fill="#2b2b2b" stroke="#f2c94c" stroke-width="1.5"/>
    <circle cx="-48" cy="22" r="6" fill="#2b2b2b" stroke="#f2c94c" stroke-width="1.5"/>
    <line x1="-42" y1="17" x2="-30" y2="15" stroke="#5c3a18" stroke-width="2"/>
    <!-- exhaust smoke -->
    <g transform="translate(8 -22)">
      <use href="#jsmoke"><animate attributeName="opacity" values="0;0.9;0" dur="1.3s" repeatCount="indefinite"/>
        <animateTransform attributeName="transform" type="translate" values="0 0;-8 -22;-16 -40" dur="1.3s" repeatCount="indefinite"/></use>
    </g>
    <!-- chassis -->
    <rect x="-24" y="6" width="56" height="13" rx="3" fill="url(#tractor)" stroke="#214d12" stroke-width="2"/>
    <!-- hood / engine toward the front (right) -->
    <rect x="14" y="-4" width="22" height="15" rx="3" fill="url(#tractor)" stroke="#214d12" stroke-width="2"/>
    <circle cx="35" cy="3" r="2.6" fill="#fff3b0" stroke="#214d12" stroke-width="0.8"/>
    <!-- cab over the rear wheel (left) -->
    <rect x="-26" y="-18" width="28" height="24" rx="4" fill="url(#tractor)" stroke="#214d12" stroke-width="2"/>
    <rect x="-21" y="-13" width="17" height="15" rx="2" fill="#cfeacd" stroke="#214d12" stroke-width="1.2"/>
    <!-- exhaust stack at front of cab -->
    <rect x="7" y="-18" width="5" height="18" rx="2" fill="#2b2b2b"/>
    <!-- rear big drive wheel (left) -->
    <circle cx="-13" cy="18" r="17" fill="#2b2b2b" stroke="#f2c94c" stroke-width="3"/>
    <circle cx="-13" cy="18" r="6" fill="#6b6b6b"/>
    <!-- front small steering wheel (right) -->
    <circle cx="26" cy="24" r="10" fill="#2b2b2b" stroke="#f2c94c" stroke-width="2.5"/>
    <circle cx="26" cy="24" r="3.5" fill="#6b6b6b"/>
  </g>
</svg>
