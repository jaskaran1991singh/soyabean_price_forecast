<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" role="img" aria-label="Soyabean Price Forecast - farm and grain banner">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9fd3ec"/>
      <stop offset="0.6" stop-color="#cfeaf2"/>
      <stop offset="1" stop-color="#f3f7df"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff6c8"/>
      <stop offset="0.6" stop-color="#ffd35a"/>
      <stop offset="1" stop-color="#ffb23e"/>
    </radialGradient>
    <linearGradient id="field" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9cc255"/>
      <stop offset="1" stop-color="#6f9c33"/>
    </linearGradient>
    <linearGradient id="soil" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a9743f"/>
      <stop offset="1" stop-color="#7c4f27"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3f7d27"/>
      <stop offset="1" stop-color="#25571a"/>
    </linearGradient>

    <!-- a wheat stalk, base at (0,0) growing up -->
    <symbol id="wheat" viewBox="-16 -96 32 100">
      <g stroke="#caa43a" stroke-width="2.4" fill="#E3B23C">
        <line x1="0" y1="0" x2="0" y2="-70" stroke="#8a9a3a" stroke-width="2.6"/>
        <g>
          <ellipse cx="0" cy="-74" rx="4.5" ry="8"/>
          <ellipse cx="-6" cy="-64" rx="4" ry="7" transform="rotate(-18 -6 -64)"/>
          <ellipse cx="6" cy="-64" rx="4" ry="7" transform="rotate(18 6 -64)"/>
          <ellipse cx="-7" cy="-54" rx="4" ry="7" transform="rotate(-20 -7 -54)"/>
          <ellipse cx="7" cy="-54" rx="4" ry="7" transform="rotate(20 7 -54)"/>
          <ellipse cx="-7" cy="-44" rx="4" ry="7" transform="rotate(-22 -7 -44)"/>
          <ellipse cx="7" cy="-44" rx="4" ry="7" transform="rotate(22 7 -44)"/>
        </g>
        <g stroke="#d8bd63" stroke-width="1.2">
          <line x1="0" y1="-80" x2="0" y2="-94"/>
          <line x1="0" y1="-80" x2="-7" y2="-93"/>
          <line x1="0" y1="-80" x2="7" y2="-93"/>
        </g>
      </g>
    </symbol>
    <!-- a soy plant with a pod -->
    <symbol id="soy" viewBox="-20 -80 40 84">
      <line x1="0" y1="0" x2="0" y2="-58" stroke="#4e7d2a" stroke-width="2.6"/>
      <path d="M0 -40 C-16 -46 -18 -34 -4 -32 C-10 -40 -4 -42 0 -40Z" fill="#6aa83a" stroke="#3f6b22" stroke-width="0.6"/>
      <path d="M0 -50 C16 -56 18 -44 4 -42 C10 -50 4 -52 0 -50Z" fill="#6aa83a" stroke="#3f6b22" stroke-width="0.6"/>
      <path d="M0 -30 C-14 -24 -14 -14 -2 -18Z" fill="#7cb94a" stroke="#3f6b22" stroke-width="0.6"/>
      <g transform="translate(0 -60)">
        <path d="M-9 0 q9 -8 18 0" fill="none" stroke="#9fce63" stroke-width="5" stroke-linecap="round"/>
        <circle cx="-4" cy="-3" r="2.6" fill="#b7d98a"/>
        <circle cx="4" cy="-3" r="2.6" fill="#b7d98a"/>
      </g>
    </symbol>
    <!-- a corn stalk -->
    <symbol id="corn" viewBox="-22 -100 44 104">
      <line x1="0" y1="0" x2="0" y2="-88" stroke="#5c8a2c" stroke-width="3"/>
      <path d="M0 -30 C-22 -40 -24 -20 -2 -22" fill="#6fa235" stroke="#436b1f" stroke-width="0.6"/>
      <path d="M0 -48 C22 -58 24 -38 2 -40" fill="#6fa235" stroke="#436b1f" stroke-width="0.6"/>
      <path d="M0 -62 C-20 -72 -22 -54 -2 -56" fill="#6fa235" stroke="#436b1f" stroke-width="0.6"/>
      <g transform="translate(6 -52)">
        <ellipse cx="0" cy="0" rx="6" ry="14" fill="#f2c94c" stroke="#c99a1e" stroke-width="0.8"/>
        <path d="M0 -14 l-3 -10 M0 -14 l3 -10 M0 -14 l0 -12" stroke="#e8d68a" stroke-width="1.5"/>
      </g>
    </symbol>

    <symbol id="cloud" viewBox="0 0 120 50">
      <g fill="#ffffff" opacity="0.92">
        <ellipse cx="38" cy="32" rx="30" ry="16"/>
        <ellipse cx="64" cy="26" rx="26" ry="18"/>
        <ellipse cx="88" cy="33" rx="24" ry="14"/>
        <rect x="30" y="32" width="66" height="12" rx="6"/>
      </g>
    </symbol>
  </defs>

  <!-- sky -->
  <rect x="6" y="6" width="1188" height="348" rx="20" fill="url(#sky)" stroke="#6f9c33" stroke-width="3"/>

  <!-- sun -->
  <g transform="translate(1060 96)">
    <circle r="46" fill="url(#sun)">
      <animate attributeName="r" values="46;49;46" dur="5s" repeatCount="indefinite"/>
    </circle>
    <g stroke="#ffcf5e" stroke-width="3" opacity="0.8">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="60s" repeatCount="indefinite"/>
      <line x1="0" y1="-58" x2="0" y2="-70"/><line x1="0" y1="58" x2="0" y2="70"/>
      <line x1="-58" y1="0" x2="-70" y2="0"/><line x1="58" y1="0" x2="70" y2="0"/>
      <line x1="-41" y1="-41" x2="-50" y2="-50"/><line x1="41" y1="41" x2="50" y2="50"/>
      <line x1="-41" y1="41" x2="-50" y2="50"/><line x1="41" y1="-41" x2="50" y2="-50"/>
    </g>
  </g>

  <!-- clouds drifting -->
  <g opacity="0.95">
    <use href="#cloud" x="120" y="54" width="150" height="62">
      <animateTransform attributeName="transform" type="translate" values="0 0; 40 0; 0 0" dur="22s" repeatCount="indefinite"/>
    </use>
    <use href="#cloud" x="560" y="38" width="120" height="50">
      <animateTransform attributeName="transform" type="translate" values="0 0; -34 0; 0 0" dur="26s" repeatCount="indefinite"/>
    </use>
  </g>

  <!-- rolling hills -->
  <path d="M6 210 Q300 160 620 205 T1194 196 L1194 320 L6 320 Z" fill="#8bbb49"/>
  <path d="M6 236 Q360 196 720 240 T1194 228 L1194 330 L6 330 Z" fill="#7aa83c"/>

  <!-- little barn + silo on the left hill -->
  <g transform="translate(120 176)">
    <rect x="-2" y="2" width="22" height="34" fill="#cfd8dc" stroke="#8a97a0" stroke-width="1.5" rx="3"/>
    <ellipse cx="9" cy="2" rx="11" ry="5" fill="#aeb9bf"/>
    <rect x="26" y="8" width="44" height="30" fill="#b23a2e" stroke="#7d241b" stroke-width="1.5"/>
    <path d="M24 8 L48 -6 L72 8 Z" fill="#8f2a20" stroke="#6d201a" stroke-width="1.5"/>
    <rect x="42" y="20" width="12" height="18" fill="#efe3c6" stroke="#7d241b" stroke-width="1.2"/>
    <path d="M42 20 L54 38 M54 20 L42 38" stroke="#7d241b" stroke-width="1"/>
  </g>

  <!-- ploughed field with converging furrows -->
  <path d="M6 300 L1194 300 L1194 354 L6 354 Z" fill="url(#soil)"/>
  <g stroke="#6a4522" stroke-width="2" opacity="0.7">
    <path d="M600 300 L120 354"/><path d="M600 300 L300 354"/><path d="M600 300 L470 354"/>
    <path d="M600 300 L600 354"/><path d="M600 300 L730 354"/><path d="M600 300 L900 354"/>
    <path d="M600 300 L1080 354"/>
  </g>

  <!-- front row of mixed grain stalks, gently swaying -->
  <g>
    <g transform="translate(70 304)"><g><animateTransform attributeName="transform" type="rotate" values="-2.5;2.5;-2.5" dur="4.5s" repeatCount="indefinite"/><use href="#wheat" x="-16" y="-96" width="32" height="100"/></g></g>
    <g transform="translate(140 306)"><g><animateTransform attributeName="transform" type="rotate" values="2;-2;2" dur="5.2s" repeatCount="indefinite"/><use href="#soy" x="-20" y="-80" width="40" height="84"/></g></g>
    <g transform="translate(210 304)"><g><animateTransform attributeName="transform" type="rotate" values="-2;2;-2" dur="4.8s" repeatCount="indefinite"/><use href="#corn" x="-22" y="-100" width="44" height="104"/></g></g>
    <g transform="translate(275 306)"><g><animateTransform attributeName="transform" type="rotate" values="2.5;-2.5;2.5" dur="5.6s" repeatCount="indefinite"/><use href="#wheat" x="-16" y="-96" width="32" height="100"/></g></g>
    <g transform="translate(900 304)"><g><animateTransform attributeName="transform" type="rotate" values="-2.5;2.5;-2.5" dur="5s" repeatCount="indefinite"/><use href="#wheat" x="-16" y="-96" width="32" height="100"/></g></g>
    <g transform="translate(965 306)"><g><animateTransform attributeName="transform" type="rotate" values="2;-2;2" dur="4.6s" repeatCount="indefinite"/><use href="#soy" x="-20" y="-80" width="40" height="84"/></g></g>
    <g transform="translate(1035 304)"><g><animateTransform attributeName="transform" type="rotate" values="-2;2;-2" dur="5.4s" repeatCount="indefinite"/><use href="#corn" x="-22" y="-100" width="44" height="104"/></g></g>
    <g transform="translate(1105 306)"><g><animateTransform attributeName="transform" type="rotate" values="2.5;-2.5;2.5" dur="4.9s" repeatCount="indefinite"/><use href="#wheat" x="-16" y="-96" width="32" height="100"/></g></g>
  </g>

  <!-- title -->
  <g text-anchor="middle" font-family="'Georgia','Trebuchet MS',serif">
    <text x="600" y="118" font-size="62" font-weight="900" fill="url(#title)" stroke="#f3f7df" stroke-width="0.5" letter-spacing="1">SOYABEAN PRICE FORECAST</text>
    <text x="600" y="150" font-size="20" fill="#3f6b22" font-style="italic" font-family="'Trebuchet MS',sans-serif">from field to forecast · point-in-time weekly training data</text>
  </g>
</svg>
