<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" role="img" aria-label="Soyabean Price Forecast - desi truck-art banner">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2d0b3a"/>
      <stop offset="0.5" stop-color="#5a1230"/>
      <stop offset="1" stop-color="#7a1f12"/>
    </linearGradient>
    <radialGradient id="petal" cx="0.5" cy="0.4" r="0.7">
      <stop offset="0" stop-color="#FFE08A"/>
      <stop offset="0.55" stop-color="#FFB02E"/>
      <stop offset="1" stop-color="#F26419"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFC700"/>
      <stop offset="0.5" stop-color="#FFF3B0"/>
      <stop offset="1" stop-color="#E1A500"/>
      <animate attributeName="x1" values="-1;1" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0;2" dur="4s" repeatCount="indefinite"/>
    </linearGradient>
    <symbol id="marigold" viewBox="-24 -24 48 48">
      <g fill="url(#petal)" stroke="#C0410F" stroke-width="0.4">
        <g>
          <ellipse cx="0" cy="-15" rx="6.5" ry="12"/>
          <ellipse cx="0" cy="-15" rx="6.5" ry="12" transform="rotate(30)"/>
          <ellipse cx="0" cy="-15" rx="6.5" ry="12" transform="rotate(60)"/>
          <ellipse cx="0" cy="-15" rx="6.5" ry="12" transform="rotate(90)"/>
          <ellipse cx="0" cy="-15" rx="6.5" ry="12" transform="rotate(120)"/>
          <ellipse cx="0" cy="-15" rx="6.5" ry="12" transform="rotate(150)"/>
          <ellipse cx="0" cy="-15" rx="6.5" ry="12" transform="rotate(180)"/>
          <ellipse cx="0" cy="-15" rx="6.5" ry="12" transform="rotate(210)"/>
          <ellipse cx="0" cy="-15" rx="6.5" ry="12" transform="rotate(240)"/>
          <ellipse cx="0" cy="-15" rx="6.5" ry="12" transform="rotate(270)"/>
          <ellipse cx="0" cy="-15" rx="6.5" ry="12" transform="rotate(300)"/>
          <ellipse cx="0" cy="-15" rx="6.5" ry="12" transform="rotate(330)"/>
        </g>
        <g>
          <ellipse cx="0" cy="-8" rx="4.5" ry="8" transform="rotate(15)"/>
          <ellipse cx="0" cy="-8" rx="4.5" ry="8" transform="rotate(75)"/>
          <ellipse cx="0" cy="-8" rx="4.5" ry="8" transform="rotate(135)"/>
          <ellipse cx="0" cy="-8" rx="4.5" ry="8" transform="rotate(195)"/>
          <ellipse cx="0" cy="-8" rx="4.5" ry="8" transform="rotate(255)"/>
          <ellipse cx="0" cy="-8" rx="4.5" ry="8" transform="rotate(315)"/>
        </g>
      </g>
      <circle r="4.5" fill="#B8350B"/>
    </symbol>
    <symbol id="leaf" viewBox="-10 -10 20 20">
      <path d="M0 -9 C7 -4 7 4 0 9 C-7 4 -7 -4 0 -9 Z" fill="#1f7a3d" stroke="#0e4d24" stroke-width="0.5"/>
      <path d="M0 -8 L0 8" stroke="#0e4d24" stroke-width="0.6"/>
    </symbol>
  </defs>

  <!-- panel -->
  <rect x="6" y="6" width="1188" height="348" rx="22" fill="url(#sky)" stroke="#FFC700" stroke-width="3"/>
  <rect x="16" y="16" width="1168" height="328" rx="16" fill="none" stroke="#F26419" stroke-width="1.5" stroke-dasharray="2 7"/>

  <!-- paisley corner flourishes -->
  <g fill="none" stroke="#E1A500" stroke-width="2" opacity="0.5">
    <path d="M40 300 q50 -10 44 -56 q-4 -34 -34 -30 q-22 3 -14 24 q6 15 24 8"/>
    <path d="M1160 60 q-50 10 -44 56 q4 34 34 30 q22 -3 14 -24 q-6 -15 -24 -8"/>
  </g>

  <!-- toran garland (marigolds + leaves) with gentle sway -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0; 0 4; 0 0" dur="5s" repeatCount="indefinite"/>
    <path d="M30 40 Q600 90 1170 40" fill="none" stroke="#1f7a3d" stroke-width="2.5" opacity="0.7"/>
    <g>
      <use href="#marigold" x="18"  y="26" width="40" height="40"/>
      <use href="#leaf" x="70" y="40" width="20" height="20"/>
      <use href="#marigold" x="104" y="34" width="38" height="38"/>
      <use href="#leaf" x="156" y="48" width="18" height="18"/>
      <use href="#marigold" x="188" y="40" width="40" height="40"/>
      <use href="#leaf" x="244" y="54" width="18" height="18"/>
      <use href="#marigold" x="276" y="46" width="38" height="38"/>
      <use href="#marigold" x="360" y="52" width="36" height="36"/>
      <use href="#leaf" x="430" y="62" width="18" height="18"/>
      <use href="#marigold" x="470" y="56" width="36" height="36"/>
      <use href="#marigold" x="560" y="58" width="36" height="36"/>
      <use href="#marigold" x="640" y="58" width="36" height="36"/>
      <use href="#marigold" x="712" y="56" width="36" height="36"/>
      <use href="#leaf" x="760" y="62" width="18" height="18"/>
      <use href="#marigold" x="800" y="52" width="36" height="36"/>
      <use href="#marigold" x="884" y="46" width="38" height="38"/>
      <use href="#leaf" x="940" y="54" width="18" height="18"/>
      <use href="#marigold" x="972" y="40" width="40" height="40"/>
      <use href="#marigold" x="1058" y="34" width="38" height="38"/>
      <use href="#leaf" x="1110" y="40" width="20" height="20"/>
      <use href="#marigold" x="1142" y="26" width="40" height="40"/>
    </g>
  </g>

  <!-- rotating ashoka-style data chakra -->
  <g transform="translate(205 210)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="18s" repeatCount="indefinite"/>
      <circle r="74" fill="#0a1a52" stroke="#FFC700" stroke-width="3"/>
      <circle r="58" fill="none" stroke="#9fb3ff" stroke-width="1.5"/>
      <g stroke="#dfe7ff" stroke-width="2.4">
        <line x1="0" y1="0" x2="0" y2="-70"/>
        <line x1="0" y1="0" x2="0" y2="-70" transform="rotate(15)"/>
        <line x1="0" y1="0" x2="0" y2="-70" transform="rotate(30)"/>
        <line x1="0" y1="0" x2="0" y2="-70" transform="rotate(45)"/>
        <line x1="0" y1="0" x2="0" y2="-70" transform="rotate(60)"/>
        <line x1="0" y1="0" x2="0" y2="-70" transform="rotate(75)"/>
        <line x1="0" y1="0" x2="0" y2="-70" transform="rotate(90)"/>
        <line x1="0" y1="0" x2="0" y2="-70" transform="rotate(105)"/>
        <line x1="0" y1="0" x2="0" y2="-70" transform="rotate(120)"/>
        <line x1="0" y1="0" x2="0" y2="-70" transform="rotate(135)"/>
        <line x1="0" y1="0" x2="0" y2="-70" transform="rotate(150)"/>
        <line x1="0" y1="0" x2="0" y2="-70" transform="rotate(165)"/>
        <line x1="0" y1="0" x2="0" y2="-70" transform="rotate(180)"/>
        <line x1="0" y1="0" x2="0" y2="-70" transform="rotate(195)"/>
        <line x1="0" y1="0" x2="0" y2="-70" transform="rotate(210)"/>
        <line x1="0" y1="0" x2="0" y2="-70" transform="rotate(225)"/>
        <line x1="0" y1="0" x2="0" y2="-70" transform="rotate(240)"/>
        <line x1="0" y1="0" x2="0" y2="-70" transform="rotate(255)"/>
        <line x1="0" y1="0" x2="0" y2="-70" transform="rotate(270)"/>
        <line x1="0" y1="0" x2="0" y2="-70" transform="rotate(285)"/>
        <line x1="0" y1="0" x2="0" y2="-70" transform="rotate(300)"/>
        <line x1="0" y1="0" x2="0" y2="-70" transform="rotate(315)"/>
        <line x1="0" y1="0" x2="0" y2="-70" transform="rotate(330)"/>
        <line x1="0" y1="0" x2="0" y2="-70" transform="rotate(345)"/>
      </g>
      <circle r="10" fill="#FFC700"/>
    </g>
    <!-- soybean pod sitting on the hub -->
    <g transform="translate(0 2)">
      <path d="M-26 20 q26 -18 52 0" fill="none" stroke="#bfe3a0" stroke-width="7" stroke-linecap="round"/>
      <circle cx="-14" cy="14" r="4.5" fill="#8bc34a"/>
      <circle cx="0" cy="10" r="4.5" fill="#8bc34a"/>
      <circle cx="14" cy="14" r="4.5" fill="#8bc34a"/>
    </g>
  </g>

  <!-- title block -->
  <g text-anchor="start" font-family="'Trebuchet MS','Segoe UI',sans-serif">
    <text x="330" y="150" font-size="34" fill="#FFE08A" font-family="'Nirmala UI','Noto Sans Devanagari',sans-serif">सोयाबीन भाव · भविष्यवाणी</text>
    <text x="330" y="214" font-size="66" font-weight="900" fill="url(#gold)" stroke="#5a1230" stroke-width="0.6" letter-spacing="1">SOYABEAN PRICE FORECAST</text>
    <text x="332" y="252" font-size="21" fill="#ffd9b0" font-style="italic">point-in-time weekly training data · मंडी से मॉडल तक</text>
  </g>

  <!-- 'BHAV OK PLEASE' truck ribbon -->
  <g transform="translate(600 300)" text-anchor="middle">
    <rect x="-250" y="-22" width="500" height="44" rx="22" fill="#138808" stroke="#FFC700" stroke-width="2.5"/>
    <rect x="-242" y="-15" width="484" height="30" rx="15" fill="none" stroke="#ffffff" stroke-width="1" stroke-dasharray="3 5"/>
    <text x="0" y="7" font-size="22" font-weight="800" letter-spacing="4" fill="#ffffff" font-family="'Trebuchet MS',sans-serif">BHAV&#160;OK&#160;PLEASE&#160;·&#160;हॉर्न&#160;OK&#160;प्लीज़</text>
  </g>

  <!-- tricolour base -->
  <rect x="6" y="330" width="1188" height="8" fill="#FF9933"/>
  <rect x="6" y="338" width="1188" height="8" fill="#ffffff"/>
  <rect x="6" y="346" width="1188" height="8" fill="#138808" rx="0"/>
</svg>
