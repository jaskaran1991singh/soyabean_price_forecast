<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 360" width="1120" height="360" role="img" aria-label="The point-in-time cutoff as a harvest line: grown crops are usable, future crops are not yet sprouted">
  <defs>
    <linearGradient id="csky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cfeaf4"/><stop offset="1" stop-color="#eef7e4"/>
    </linearGradient>
    <linearGradient id="grown" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a7cf6a"/><stop offset="1" stop-color="#7aa83c"/>
    </linearGradient>
    <linearGradient id="fallow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c9a473"/><stop offset="1" stop-color="#a9743f"/>
    </linearGradient>
    <pattern id="furrow" width="12" height="12" patternUnits="userSpaceOnUse">
      <rect width="12" height="12" fill="none"/>
      <line x1="0" y1="6" x2="12" y2="6" stroke="#8a5a2b" stroke-width="2" opacity="0.4"/>
    </pattern>
    <filter id="cglow"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <!-- tiny grown wheat -->
    <symbol id="w2" viewBox="-8 -30 16 32">
      <line x1="0" y1="0" x2="0" y2="-22" stroke="#8a9a3a" stroke-width="2"/>
      <g fill="#E3B23C" stroke="#caa43a" stroke-width="1">
        <ellipse cx="0" cy="-24" rx="3" ry="5"/><ellipse cx="-4" cy="-18" rx="2.6" ry="4.5"/><ellipse cx="4" cy="-18" rx="2.6" ry="4.5"/>
      </g>
    </symbol>
    <!-- tiny seedling (future) -->
    <symbol id="sprout" viewBox="-8 -18 16 20">
      <line x1="0" y1="0" x2="0" y2="-10" stroke="#9ab86a" stroke-width="1.6"/>
      <path d="M0 -8 C-7 -12 -7 -4 -1 -5Z" fill="#b7d98a"/>
      <path d="M0 -10 C7 -14 7 -6 1 -7Z" fill="#c9e3a0"/>
    </symbol>
  </defs>

  <rect x="4" y="4" width="1112" height="352" rx="16" fill="url(#csky)" stroke="#6f9c33" stroke-width="3"/>

  <!-- grown vs fallow land -->
  <rect x="20" y="150" width="620" height="150" rx="6" fill="url(#grown)"/>
  <rect x="640" y="150" width="460" height="150" rx="6" fill="url(#fallow)"/>
  <rect x="640" y="150" width="460" height="150" rx="6" fill="url(#furrow)"/>

  <text x="300" y="96" text-anchor="middle" font-family="'Georgia',serif" font-size="16" font-weight="800" fill="#2f5d1a">🌾 GROWN (available_at ≤ cutoff)</text>
  <text x="890" y="96" text-anchor="middle" font-family="'Georgia',serif" font-size="16" font-weight="800" fill="#8a4a1e">🌱 NOT YET GROWN (the future)</text>

  <!-- ground line with weekday furrow ticks -->
  <line x1="40" y1="300" x2="1080" y2="300" stroke="#6e4620" stroke-width="3"/>
  <g stroke="#6e4620" stroke-width="2" font-family="'Trebuchet MS',sans-serif" font-size="11" fill="#5c3a18" text-anchor="middle">
    <line x1="120" y1="294" x2="120" y2="306"/><text x="120" y="322">Mon</text>
    <line x1="230" y1="294" x2="230" y2="306"/><text x="230" y="322">Tue</text>
    <line x1="340" y1="294" x2="340" y2="306"/><text x="340" y="322">Wed</text>
    <line x1="450" y1="294" x2="450" y2="306"/><text x="450" y="322">Thu</text>
    <line x1="560" y1="294" x2="560" y2="306"/><text x="560" y="328" font-weight="800">Fri = week_end</text>
    <line x1="640" y1="294" x2="640" y2="306"/>
    <line x1="760" y1="294" x2="760" y2="306"/><text x="760" y="322">Sun</text>
    <line x1="880" y1="294" x2="880" y2="306"/><text x="880" y="322">next week…</text>
  </g>

  <!-- grown crops = knowable data points -->
  <g font-family="'Trebuchet MS',sans-serif" font-size="11" text-anchor="middle" fill="#2f3b16">
    <use href="#w2" x="172" y="168" width="16" height="32"/><text x="180" y="146">mandi price</text>
    <use href="#w2" x="292" y="188" width="16" height="32"/><text x="300" y="166">weather</text>
    <use href="#w2" x="422" y="162" width="16" height="32"/><text x="430" y="140">news (publish date)</text>
    <use href="#w2" x="532" y="190" width="16" height="32"/><text x="540" y="214" fill="#2f3b16">CBOT close</text>
  </g>

  <!-- the harvest-line fence at the cutoff -->
  <g filter="url(#cglow)">
    <rect x="636" y="120" width="8" height="180" rx="2" fill="#8a5a2b"/>
    <rect x="596" y="150" width="88" height="7" rx="2" fill="#a9743f"/>
    <rect x="596" y="178" width="88" height="7" rx="2" fill="#a9743f"/>
    <rect x="596" y="118" width="12" height="182" rx="2" fill="#8a5a2b"/>
    <rect x="672" y="118" width="12" height="182" rx="2" fill="#8a5a2b"/>
    <path d="M596 118 l6 -10 l6 10Z" fill="#6e4620"/>
    <path d="M672 118 l6 -10 l6 10Z" fill="#6e4620"/>
  </g>
  <rect x="604" y="150" width="72" height="24" rx="4" fill="#efe3c6" stroke="#6e4620" stroke-width="2"/>
  <text x="640" y="167" text-anchor="middle" font-family="'Georgia',serif" font-size="13" font-weight="900" fill="#8a4a1e">CUTOFF</text>
  <text x="640" y="46" text-anchor="middle" font-family="'Georgia',serif" font-size="14" font-weight="800" fill="#6e4620">THE HARVEST LINE</text>
  <text x="640" y="344" text-anchor="middle" font-family="'Trebuchet MS',sans-serif" font-size="12" fill="#4a2f16">Saturday = week_end + forecast_lag_days · the day the forecast is made</text>

  <!-- future seedlings -->
  <g opacity="0.9">
    <use href="#sprout" x="752" y="180" width="16" height="20"/>
    <use href="#sprout" x="872" y="184" width="16" height="20"/>
  </g>

  <!-- the label we predict, growing in the future -->
  <text x="640" y="70" text-anchor="middle" font-family="'Trebuchet MS',sans-serif" font-size="11" font-style="italic" fill="#2f6d1a">target_y_fwd : a LABEL (we predict it) — never a feature</text>
  <path d="M560 164 C 606 112, 676 112, 820 150" fill="none" stroke="#2f6d1a" stroke-width="2.5" stroke-dasharray="6 5"/>
  <polygon points="820,150 810,142 825,139" fill="#2f6d1a"/>
  <circle cx="560" cy="164" r="6" fill="#7aa83c" stroke="#2f5d1a" stroke-width="1.5"/>
  <use href="#w2" x="812" y="136" width="18" height="34"/>
</svg>
